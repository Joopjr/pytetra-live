[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytetra-live"
version = "1.0.0"
description = "Live SpyServer IQ client and TETRA downlink demodulator for PyTetra"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "GPL-2.0-only"}
authors = [{name = "PyTetra-live contributors"}]
dependencies = ["numpy>=1.24", "scipy>=1.10"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Ham Radio",
]

[project.scripts]
pytetra-live = "pytetra_live.cli:main"

[tool.setuptools.packages.find]
include = ["pytetra_live*"]

